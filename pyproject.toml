[project]
name = "patchsplit"
version = "0.1.0"
description = "Filter-driven splitter for Git patch files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygit2>=1.20.0",
]

[project.scripts]
patchsplit = "patchsplit.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
